3ccode>LABEL app=slidessoca\u003c/code>, healthcheck),\u003c/li>\n\u003c/ul>\n\u003cp>  \u003ccode>deploy.yml\u003c/code> (develop → \u003ccode>development\u003c/code>/:3005, main → \u003ccode>production\u003c/code>/:3004, image built and\u003c/p>\n\u003cp>  smoke-tested in CI, probe after start, \"skipped deploy (no secrets)\" notice), nginx blocks,\u003c/p>\n\u003cp>  \u003ccode>deploy/wizard.sh\u003c/code>, \u003ccode>pnpm release\u003c/code>, \u003ccode>docs/deploy.md\u003c/code>. Branch protection (\u003ccode>test\u003c/code> required) was\u003c/p>\n\u003cp>  already on \u003ccode>main\u003c/code> and \u003ccode>develop\u003c/code>. Remaining: the owner runs the wizard.\u003c/p>","acTotal":7,"acDone":6},{"id":"SL-0001","type":"story","title":"Foundation: deck model, auto-layout, Markdown parser, share storage","status":"done","priority":"high","tags":["core","api"],"depends_on":[],"parent":null,"epic":null,"created":"2026-11-27","updated":"2026-11-27","project":"SL","bodyHtml":"\u003ch4 class=\"md-h\">Description\u003c/h4>\n\u003cp>As the owner, I want a solid core every surface builds on: one deck model, one renderer, a layout\u003c/p>\n\u003cp>engine that places title/text/images by itself, the Markdown format parser, and a cheap share\u003c/p>\n\u003cp>store with 30-day expiry.\u003c/p>\n\u003ch4 class=\"md-h\">Acceptance criteria\u003c/h4>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\u003ccode>Deck\u003c/code>/\u003ccode>Slide\u003c/code>/\u003ccode>SlideElement\u003c/code> model on a 1600×900 canvas (\u003ccode>src/lib/deck/types.ts\u003c/code>).\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\u003ccode>autoLayout\u003c/code> + \u003ccode>layoutElements\u003c/code> for 9 layouts; every element stays inside the canvas.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Markdown format parser + exporter that round-trips content (\u003ccode>docs/markdown-format.md\u003c/code>).\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\u003ccode>validateDeck\u003c/code> rejects unsafe image sources and malformed decks; text rendered via DOMPurify.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\u003ccode>SlideView\u003c/code> renders with pure CSS scaling (cqw) and auto-fits overflowing text.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Store: gzipped files, mtime = expiry, sweep, token-hashed ownership, quota; \u003ccode>/api/decks\u003c/code> routes.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Themes: dssoca dark/light + all presets.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Documentation updated (README, CLAUDE.md, ADR 0001, format spec).\u003c/li>\n\u003c/ul>\n\u003ch4 class=\"md-h\">Notes\u003c/h4>\n\u003cul>\n\u003cli>\u003ccode>pnpm test\u003c/code> (markdown, layout, validate, store suites).\u003c/li>\n\u003c/ul>","acTotal":8,"acDone":8},{"id":"SL-0002","type":"story","title":"PowerPoint-style editor (desktop + mobile)","status":"done","priority":"high","tags":["editor"],"depends_on":["SL-0001"],"parent":null,"epic":null,"created":"2026-11-27","updated":"2026-11-27","project":"SL","bodyHtml":"\u003ch4 class=\"md-h\">Description\u003c/h4>\n\u003cp>As the owner, I want to open a deck and edit any slide like in PowerPoint: a slide sorter, a canvas\u003c/p>\n\u003cp>where I select, drag, resize and type into elements, add text/images/shapes, pick layouts and\u003c/p>\n\u003cp>themes, write speaker notes, undo mistakes — and do the basics on my phone.\u003c/p>\n\u003ch4 class=\"md-h\">Acceptance criteria\u003c/h4>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Slide sorter: add, duplicate, delete, reorder (drag + keyboard).\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Canvas: select, move, resize, inline text edit, delete, z-order; snapping to edges/centre.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Insert text box, image (upload → compressed), shape.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Inspector: text size/colour/align/font/bold/italic, image fit/alt, slide layout, background, deck theme, deck title.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Auto slides stay auto when only text changes; manual moves flip \u003ccode>manual\u003c/code>; Re-apply layout.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Undo/redo, autosave to IndexedDB.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Mobile: usable at 360px (sorter as strip, inspector as bottom sheet).\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Tests for the editor state logic; browser pass.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Documentation updated (README).\u003c/li>\n\u003c/ul>\n\u003ch4 class=\"md-h\">Notes\u003c/h4>\n\u003cul>\n\u003cli>Pure state logic: \u003ccode>src/lib/deck/edit.ts\u003c/code> (geometry, snapping, element/slide ops, text ↔ content\u003c/li>\n\u003c/ul>\n\u003cp>  write-back, undo history with coalescing groups) — \u003ccode>test/unit/edit.test.ts\u003c/code>.\u003c/p>\n\u003cul>\n\u003cli>Components: \u003ccode>src/lib/components/editor/\u003c/code> (EditorTopBar, SlideSorter, EditorCanvas, Inspector,\u003c/li>\n\u003c/ul>\n\u003cp>  Swatches) — \u003ccode>test/unit/editor-components.test.ts\u003c/code>. Route: \u003ccode>src/routes/edit/[id]/+page.svelte\u003c/code>.\u003c/p>\n\u003cul>\n\u003cli>Touch: only the selected element captures touch drags (\u003ccode>touch-action: none\u003c/code>), so the page still\u003c/li>\n\u003c/ul>\n\u003cp>  scrolls elsewhere; slide reorder on touch uses the Move earlier / later buttons.\u003c/p>\n\u003cul>\n\u003cli>Browser pass (headless Chromium, 1280×800 + 360×740, dark + light deck themes): create, add\u003c/li>\n\u003c/ul>\n\u003cp>  slides, drag/resize, inline edit, undo/redo, image picker + drop, reload persists.\u003c/p>","acTotal":9,"acDone":9},{"id":"SL-0003","type":"story","title":"Quick create and Markdown import/export","status":"done","priority":"high","tags":["import","markdown"],"depends_on":["SL-0001"],"parent":null,"epic":null,"created":"2026-11-27","updated":"2026-11-27","project":"SL","bodyHtml":"\u003ch4 class=\"md-h\">Description\u003c/h4>\n\u003cp>As the owner, I want to make a deck by just typing a title, some text and dropping images — and\u003c/p>\n\u003cp>by uploading a Markdown file (plus its images) — and have the whole presentation mounted for me.\u003c/p>\n\u003cp>I also want to download any deck back as Markdown.\u003c/p>\n\u003ch4 class=\"md-h\">Acceptance criteria\u003c/h4>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>/new: Quick create (deck title, theme, one block per slide: title, text, images) → deck.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>/new: Markdown upload (.md + image files, drag-drop or picker) and paste; preview of the\u003c/li>\n\u003c/ul>\n\u003cp>      slides before creating; missing images listed.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>In-app format help page matching \u003ccode>docs/markdown-format.md\u003c/code>.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Export: download deck as .md (+ images) and as JSON; import JSON.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Mobile friendly.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Tests; browser pass.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Documentation updated (README, format doc).\u003c/li>\n\u003c/ul>\n\u003ch4 class=\"md-h\">Notes\u003c/h4>\n\u003cul>\n\u003cli>Quick create (\u003ccode>/new\u003c/code>): \"Slide by slide\" blocks (title, text, images; add / reorder / remove) or\u003c/li>\n\u003c/ul>\n\u003cp>  \"One text box\" — a \u003ccode>---\u003c/code> line starts a slide (SL-0009; it used to be an empty line), first\u003c/p>\n\u003cp>  line = title (a chunk starting with \u003ccode>&gt;\u003c/code>, a list item or an image has no title). Pure logic in\u003c/p>\n\u003cp>  \u003ccode>src/lib/deck/quick.ts\u003c/code>; drafts survive tab switches (\u003ccode>src/routes/new/draft.svelte.ts\u003c/code>).\u003c/p>\n\u003cul>\n\u003cli>Markdown tab accepts \u003ccode>.md\u003c/code>/\u003ccode>.markdown\u003c/code>/\u003ccode>.txt\u003c/code> + images, or a \u003ccode>.zip\u003c/code> (STORE + DEFLATE reader in\u003c/li>\n\u003c/ul>\n\u003cp>  \u003ccode>src/lib/deck/zip.ts\u003c/code>). Missing images are listed; adding files re-parses live.\u003c/p>\n\u003cul>\n\u003cli>Export: \u003ccode>deckToBundle\u003c/code> → \u003ccode>deck.md\u003c/code> + \u003ccode>images/slide-N-M.ext\u003c/code>, zipped with the STORE-only writer\u003c/li>\n\u003c/ul>\n\u003cp>  (plain \u003ccode>.md\u003c/code> when the deck has no embedded images). JSON import via \u003ccode>importDeckJson\u003c/code>.\u003c/p>\n\u003cul>\n\u003cli>Parser fixes: front-matter \u003ccode># comments\u003c/code> (the spec example had them), layout overrides written\u003c/li>\n\u003c/ul>\n\u003cp>  only when they differ from the implied layout (section-with-subtitle used to come back as\u003c/p>\n\u003cp>  title), \u003ccode>---\u003c/code> lines inside a body no longer split slides on export.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>/format\u003c/code> renders \u003ccode>docs/markdown-format.md\u003c/code> itself (marked + DOMPurify).\u003c/li>\n\u003c/ul>","acTotal":7,"acDone":7},{"id":"SL-0004","type":"story","title":"Viewer, presenter, overview and 30-day share links","status":"done","priority":"high","tags":["viewer","share"],"depends_on":["SL-0001"],"parent":null,"epic":null,"created":"2026-11-27","updated":"2026-11-27","project":"SL","bodyHtml":"\u003ch4 class=\"md-h\">Description\u003c/h4>\n\u003cp>As the owner, I want to present a deck (fullscreen, keyboard, speaker notes), check every page at a\u003c/p>\n\u003cp>glance, and create a public link that lives for a month. As a viewer, I want the deck to work\u003c/p>\n\u003cp>nicely on my phone.\u003c/p>\n\u003ch4 class=\"md-h\">Acceptance criteria\u003c/h4>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Share dialog in the editor: publish, copy link, republish (same link, restarts 30 days),\u003c/li>\n\u003c/ul>\n\u003cp>      unpublish; shows the expiry date.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>/s/[id]: viewer with arrows/space/swipe, fullscreen, slide counter, overview grid; SSR with\u003c/li>\n\u003c/ul>\n\u003cp>      og tags; expired → friendly page.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Presenter mode: current + next slide, notes, timer.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\"Make a copy\" of a shared deck into my browser to edit.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Mobile: swipe, tap zones, fits portrait and landscape.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Tests; browser pass.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Documentation updated (README).\u003c/li>\n\u003c/ul>\n\u003ch4 class=\"md-h\">Notes\u003c/h4>\n\u003cul>\n\u003cli>Player: \u003ccode>src/lib/components/player/\u003c/code> (DeckPlayer, Stage letterbox, Overview, gestures, fullscreen);\u003c/li>\n\u003c/ul>\n\u003cp>  navigation rules are the pure \u003ccode>src/lib/deck/nav.ts\u003c/code>.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>/s/[id]\u003c/code> server-renders real Markdown: \u003ccode>render.ts\u003c/code> now renders through a no-raw-HTML marked\u003c/li>\n\u003c/ul>\n\u003cp>  renderer + tag/attribute allowlist (no DOM needed), with DOMPurify on top in the browser.\u003c/p>\n\u003cul>\n\u003cli>Presenter audience window syncs over \u003ccode>BroadcastChannel\u003c/code> (\u003ccode>slidessoca:present:&lt;deckId&gt;\u003c/code>).\u003c/li>\n\u003c/ul>","acTotal":7,"acDone":7},{"id":"SL-0006","type":"task","title":"Unslop pass across every screen","status":"done","priority":"high","tags":["ui","polish"],"depends_on":[],"parent":null,"epic":null,"created":"2026-11-27","updated":"2026-11-27","project":"SL","bodyHtml":"\u003ch4 class=\"md-h\">Description\u003c/h4>\n\u003cp>Design redline pass (unslop skill, polish mode: the app already follows dssoca).\u003c/p>\n\u003cul>\n\u003cli>Direction: a dark auditorium — terminal facing a projector screen. The bright element is\u003c/li>\n\u003c/ul>\n\u003cp>  always the slides themselves; chrome stays quiet.\u003c/p>\n\u003cul>\n\u003cli>Signature: the zero-padded mono slide counter (\u003ccode>03 / 12\u003c/code>, \u003ccode>src/lib/deck/count.ts\u003c/code>) on the\u003c/li>\n\u003c/ul>\n\u003cp>  sorter, previews, overview, viewer, presenter, editor and deck cards.\u003c/p>\n\u003cul>\n\u003cli>Home: one primary + one secondary action, \"Blank deck\" as a quiet link; tagline; deck cards\u003c/li>\n\u003c/ul>\n\u003cp>  with weight 500 titles, \u003ccode>01 slide\u003c/code> (plural bug fixed), shared dot, actions in a menu; the empty\u003c/p>\n\u003cp>  state renders three real slides from the Markdown example.\u003c/p>\n\u003cul>\n\u003cli>SlideView: images that fail to load draw a dashed frame with the alt text instead of the\u003c/li>\n\u003c/ul>\n\u003cp>  broken-image glyph.\u003c/p>\n\u003cul>\n\u003cli>Viewer/presenter: no shadow hairlines around the letterboxed slide; title weight 500.\u003c/li>\n\u003cli>Copy: no trailing periods on toasts and single-line messages.\u003c/li>\n\u003cli>Out of scope (dssoca itself): uppercase tracked field labels in Input/Select/Textarea.\u003c/li>\n\u003c/ul>","acTotal":0,"acDone":0},{"id":"SL-0007","type":"story","title":"Download a deck as HTML, JPGs or PDF","status":"done","priority":"high","tags":["export","viewer","editor"],"depends_on":["SL-0002","SL-0004"],"parent":null,"epic":null,"created":"2026-11-27","updated":"2026-11-27","project":"SL","bodyHtml":"\u003ch4 class=\"md-h\">Description\u003c/h4>\n\u003cp>As a deck owner or a viewer of a shared link, I want to download the deck as a file I can play\u003c/p>\n\u003cp>offline (HTML), drop into other tools (JPGs) or print/send (PDF), so the deck outlives the\u003c/p>\n\u003cp>30-day link and works without the app.\u003c/p>\n\u003ch4 class=\"md-h\">Acceptance criteria\u003c/h4>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\u003cstrong>HTML\u003c/strong>: one self-contained \u003ccode>.html\u003c/code> — images embedded (http images inlined when CORS allows,\u003c/li>\n\u003c/ul>\n\u003cp>      kept as links otherwise), the deck theme's dssoca CSS + preset palette, the fonts embedded as\u003c/p>\n\u003cp>      data: URLs (falls back to the Google Fonts link, then system fonts), slides as the static\u003c/p>\n\u003cp>      sanitised markup SlideView rendered, and a vanilla-JS player: ←/→ Space PageUp/PageDown\u003c/p>\n\u003cp>      Home/End, swipe, tap thirds, F fullscreen, \u003ccode>#n\u003c/code> hash, \u003ccode>03 / 12\u003c/code> counter. Opens from disk.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Speaker notes (N toggles a panel) only in the owner's download (editor, deck list); the\u003c/li>\n\u003c/ul>\n\u003cp>      viewer's download and decks without notes have no notes UI.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\u003cstrong>JPGs\u003c/strong>: \u003ccode>.zip\u003c/code> with one 1920×1080 \u003ccode>slide-01.jpg\u003c/code>… per slide, rasterised in the browser\u003c/li>\n\u003c/ul>\n\u003cp>      (SVG foreignObject → canvas, fonts and images inlined; unreachable images draw the quiet\u003c/p>\n\u003cp>      missing frame). Never includes notes.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\u003cstrong>PDF\u003c/strong>: 16:9 pages (960×540pt), one JPEG per page (DCTDecode), zero-dependency writer.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Progress toast while rendering; editor More menu, deck-list card menu, viewer bar \"Download\"\u003c/li>\n\u003c/ul>\n\u003cp>      menu (works at 360px).\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Pure logic in \u003ccode>src/lib/export/\u003c/code> (PDF writer, HTML assembly, names) with unit tests; the\u003c/li>\n\u003c/ul>\n\u003cp>      browser part in \u003ccode>src/lib/client/downloads.ts\u003c/code>.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Browser pass: light, dark and a preset deck with uploaded/remote/dead images; HTML opened\u003c/li>\n\u003c/ul>\n\u003cp>      from disk offline and navigated; JPGs inspected; PDF parsed and rendered with pdf.js.\u003c/p>\n\u003ch4 class=\"md-h\">Notes\u003c/h4>\n\u003cul>\n\u003cli>2026-11-27: SlideView stays the only renderer: it is mounted off-screen (\u003ccode>mount\u003c/code>), left to settle\u003c/li>\n\u003c/ul>\n\u003cp>  (images, fonts, auto-fit), and its \u003ccode>outerHTML\u003c/code> is used; its scoped CSS is collected from the\u003c/p>\n\u003cp>  page's stylesheets by its \u003ccode>svelte-\u003c/code> hash. \u003ccode>svelte/server\u003c/code> \u003ccode>render\u003c/code> can't be used in the browser\u003c/p>\n\u003cp>  (client-compiled components), so DOM cloning was the robust route.\u003c/p>\n\u003cul>\n\u003cli>The SVG root carries \u003ccode>data-theme\u003c/code>/\u003ccode>data-palette\u003c/code> when rasterising: dssoca derives tokens such as\u003c/li>\n\u003c/ul>\n\u003cp>  \u003ccode>--ss-primary\u003c/code> on \u003ccode>:root\u003c/code>, which would otherwise resolve with the dark palette.\u003c/p>\n\u003cul>\n\u003cli>Open: the app itself shows light decks' \u003ccode>--ss-primary\u003c/code> with the dark accent (same \u003ccode>:root\u003c/code>\u003c/li>\n\u003c/ul>\n\u003cp>  derivation, the page root is dark) — the HTML/JPG/PDF downloads already use the right accent.\u003c/p>","acTotal":7,"acDone":7},{"id":"SL-0008","type":"story","title":"Publish rules: private speaker notes, size meter, 20 MB image cap","status":"done","priority":"high","tags":["share","images"],"depends_on":["SL-0004"],"parent":null,"epic":null,"created":"2026-11-27","updated":"2026-11-27","project":"SL","bodyHtml":"\u003ch4 class=\"md-h\">Description\u003c/h4>\n\u003cp>As the owner, I want my speaker notes to stay private unless I choose to share them, to see how\u003c/p>\n\u003cp>big a publish will be before I hit the limit, and to be stopped early when I pick an image file\u003c/p>\n\u003cp>that is far too large.\u003c/p>\n\u003ch4 class=\"md-h\">Acceptance criteria\u003c/h4>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Speaker notes are stripped from the published copy by default; the Share dialog has an\u003c/li>\n\u003c/ul>\n\u003cp>      \"Include speaker notes\" checkbox (unchecked by default), remembered per deck and used by\u003c/p>\n\u003cp>      Republish. The flag never reaches the server.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Stripping is a pure function (\u003ccode>publicDeck(deck, { notes })\u003c/code>); JSON export keeps notes.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Share dialog shows the upload size (\"4.2 MB of 15 MB\") with a bar; warning from 12 MB;\u003c/li>\n\u003c/ul>\n\u003cp>      Publish / Republish disabled at 15 MB with a \"remove or replace images\" message.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>One limits module (\u003ccode>src/lib/deck/limits.ts\u003c/code>) used by the server default and the client;\u003c/li>\n\u003c/ul>\n\u003cp>      \u003ccode>DECK_MAX_MB\u003c/code> still overrides on the server.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Image files over 20 MB are refused before compression with a \"&lt;name&gt; is over 20 MB\"\u003c/li>\n\u003c/ul>\n\u003cp>      toast: editor insert / replace / drop, inspector images, quick create, Markdown import\u003c/p>\n\u003cp>      (files and zip).\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Tests; browser pass at 1280×800 and 360×740.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Docs: README, CHANGELOG, ADR 0001 note.\u003c/li>\n\u003c/ul>\n\u003ch4 class=\"md-h\">Notes\u003c/h4>\n\u003cul>\n\u003cli>Private field: \u003ccode>Deck.publishNotes\u003c/code> (local only). The editor keeps it beside \u003ccode>share\u003c/code>, outside\u003c/li>\n\u003c/ul>\n\u003cp>  the undo history; \u003ccode>publicDeck()\u003c/code> and \u003ccode>copyDeck()\u003c/code> drop it.\u003c/p>\n\u003cul>\n\u003cli>Gate: \u003ccode>checkImageFile\u003c/code> / \u003ccode>checkImageSize\u003c/code> / \u003ccode>acceptImages\u003c/code> in \u003ccode>src/lib/client/images.ts\u003c/code>\u003c/li>\n\u003c/ul>\n\u003cp>  (\u003ccode>compressImage\u003c/code> itself is unchanged). \u003ccode>readImportFiles\u003c/code> reports \u003ccode>tooLarge\u003c/code> messages.\u003c/p>\n\u003cul>\n\u003cli>The meter measures \u003ccode>publishBody(deck)\u003c/code> — the exact JSON a publish uploads.\u003c/li>\n\u003cli>The client meter uses the default limit; if the server's \u003ccode>DECK_MAX_MB\u003c/code> is lowered, the server's\u003c/li>\n\u003c/ul>\n\u003cp>  413 still applies.\u003c/p>","acTotal":7,"acDone":7},{"id":"SL-0009","type":"story","title":"One split rule for quick create, keep small images as they are","status":"done","priority":"low","tags":["import","markdown","images"],"depends_on":["SL-0003"],"parent":null,"epic":null,"created":"2026-11-27","updated":"2026-11-27","project":"SL","bodyHtml":"\u003ch4 class=\"md-h\">Description\u003c/h4>\n\u003cp>As the owner, I want quick create's \"one text box\" to split slides the same way the Markdown\u003c/p>\n\u003cp>format does — only a line containing just \u003ccode>---\u003c/code> — so a slide can hold several paragraphs without\u003c/p>\n\u003cp>switching modes. I also want images that are already small JPEG/WebP files to keep their bytes,\u003c/p>\n\u003cp>so exporting a deck and importing it again does not lose quality each time.\u003c/p>\n\u003ch4 class=\"md-h\">Acceptance criteria\u003c/h4>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>One text box: only a \u003ccode>---\u003c/code> line starts a new slide; blank lines inside a slide are\u003c/li>\n\u003c/ul>\n\u003cp>      paragraph breaks; leading / trailing / repeated \u003ccode>---\u003c/code> lines make no empty slides.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>First line of a slide is its title unless it starts with \u003ccode>&gt;\u003c/code>, a list item or an image.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Field hint, example text and README describe the new rule.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\u003ccode>compressImage\u003c/code> keeps the original bytes of WebP / JPEG files ≤ 1920px on both edges and\u003c/li>\n\u003c/ul>\n\u003cp>      ≤ 500 KB (\u003ccode>shouldKeepOriginal\u003c/code>, pure and tested). GIFs still pass through.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Tests; browser pass (preview at 1280×800 and 360×740; .md zip export → import keeps a\u003c/li>\n\u003c/ul>\n\u003cp>      small JPEG byte-identical).\u003c/p>\n\u003ch4 class=\"md-h\">Notes\u003c/h4>\n\u003cul>\n\u003cli>\u003ccode>splitQuickText\u003c/code> now reuses the Markdown parser's \u003ccode>splitSlides\u003c/code> (also ignores \u003ccode>---\u003c/code> inside\u003c/li>\n\u003c/ul>\n\u003cp>  code fences), then applies the existing title rule. The empty-line mode is gone.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>shouldKeepOriginal({ type, width, height, bytes })\u003c/code> in \u003ccode>src/lib/client/images.ts\u003c/code>;\u003c/li>\n\u003c/ul>\n\u003cp>  \u003ccode>KEEP_ORIGINAL_BYTES = 500 KB\u003c/code>. \u003ccode>image/jpg\u003c/code> (non-standard) is still re-encoded.\u003c/p>","acTotal":5,"acDone":5},{"id":"SL-0010","type":"story","title":"No-fullscreen hint in the player and a backup reminder on home","status":"done","priority":"low","tags":["viewer","home","backup"],"depends_on":["SL-0004","SL-0003"],"parent":null,"epic":null,"created":"2026-11-27","updated":"2026-11-27","project":"SL","bodyHtml":"\u003ch4 class=\"md-h\">Description\u003c/h4>\n\u003cp>As a viewer on an iPhone, I want to know how to get the slide as big as possible, since\u003c/p>\n\u003cp>fullscreen isn't available there. As the owner, I want a quiet nudge to back up my decks, since\u003c/p>\n\u003cp>they live only in this browser's IndexedDB, and a way to restore every deck from that backup.\u003c/p>\n\u003ch4 class=\"md-h\">Acceptance criteria\u003c/h4>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Where element fullscreen is unavailable (same capability check that hides the fullscreen\u003c/li>\n\u003c/ul>\n\u003cp>      button), the viewer (\u003ccode>/s/[id]\u003c/code>) and the presenter's audience window show a image sizes stop costing storage\u003c/p>\n\u003cp>(ADR 0002: \"Make all images URLs. This way we do not suffer by user image size.\").\u003c/p>\n\u003ch4 class=\"md-h\">Acceptance criteria\u003c/h4>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\u003ccode>validateDeck(input, { allowDataImages })\u003c/code>: strict by default; \u003ccode>/api/decks\u003c/code> POST/PUT answer\u003c/li>\n\u003c/ul>\n\u003cp>      400 to a deck with a \u003ccode>data:\u003c/code> image, naming the slide. JSON import, backup restore and \"Make\u003c/p>\n\u003cp>      a copy\" pass \u003ccode>allowDataImages: true\u003c/code>, so legacy local decks keep loading.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>The Share dialog lists the slides with uploaded images, asks for links and blocks Publish /\u003c/li>\n\u003c/ul>\n\u003cp>      Republish until they are replaced.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Editor (Image button → URL dialog, canvas drop of a link), Inspector (Replace image, content\u003c/li>\n\u003c/ul>\n\u003cp>      images) and quick create blocks take an \"Image URL\" with a preview and alt text. Dropping or\u003c/p>\n\u003cp>      pasting an image file shows a \"links only\" toast.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\u003ccode>compressImage\u003c/code>, \u003ccode>shouldKeepOriginal\u003c/code>, \u003ccode>checkImageFile\u003c/code>, \u003ccode>acceptImages\u003c/code>, \u003ccode>IMAGE_FILE_MAX_MB\u003c/code>\u003c/li>\n\u003c/ul>\n\u003cp>      and their tests are removed.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Markdown import keeps \u003ccode>!\u003ca href=\"https://…\" rel=\"noreferrer\">alt\u003c/a>\u003c/code>; local paths and images in a zip are not\u003c/li>\n\u003c/ul>\n\u003cp>      embedded, one warning per image (\"use a full https link\"). \u003ccode>docs/markdown-format.md\u003c/code> (and\u003c/p>\n\u003cp>      the in-app /format page) updated; the example uses Wikimedia links.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\u003ccode>DECK_MAX_MB\u003c/code> is 1; the size meter is gone. Body limits stay at 16 MB (still above).\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>SlideView images: \u003ccode>referrerpolicy=\"no-referrer\"\u003c/code>, \u003ccode>decoding=\"async\"\u003c/code>, \u003ccode>loading=\"lazy\"\u003c/code>\u003c/li>\n\u003c/ul>\n\u003cp>      (exports switch to eager); the missing-image frame stays.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>JPG/PDF/HTML downloads inline images via \u003ccode>fetch(mode: 'cors')\u003c/code> only for the export; CORS\u003c/li>\n\u003c/ul>\n\u003cp>      refusals draw the missing frame (JPG/PDF) or keep the link (HTML) and a toast says how many.\u003c/p>\n\u003cp>      No server proxy.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>ADR 0002, ADR 0001 note, CLAUDE.md invariant 5, README, CHANGELOG.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Tests: validator strict/legacy paths, API 400, Markdown warnings, Share dialog block, export\u003c/li>\n\u003c/ul>\n\u003cp>      fallback with a failing fetch, Inspector URL input, drop/paste helpers.\u003c/p>","acTotal":10,"acDone":10},{"id":"SL-0012","type":"story","title":"Example decks: four ready-made decks to read, present and copy","status":"done","priority":"medium","tags":["examples","home","new","markdown","present"],"depends_on":["SL-0003","SL-0004","SL-0011"],"parent":null,"epic":null,"created":"2026-11-28","updated":"2026-11-28","project":"SL","bodyHtml":"\u003ch4 class=\"md-h\">Description\u003c/h4>\n\u003cp>As a new user, I want a few finished example decks I can open, read, present and copy, so I can\u003c/p>\n\u003cp>see what slidessoca makes and start from something real (\"Generate a few examples for users,\u003c/p>\n\u003cp>with random themes\").\u003c/p>\n\u003ch4 class=\"md-h\">Acceptance criteria\u003c/h4>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Four decks as Markdown files in \u003ccode>src/lib/examples/\u003c/code> (the repo's own format, parsed at\u003c/li>\n\u003c/ul>\n\u003cp>      runtime): Stalker (gruvbox), The first computer bug (light), Why democracy fails (nord),\u003c/p>\n\u003cp>      Miracles you can witness (coffee). 8–12 slides each, title/section/bullets/image/gallery/\u003c/p>\n\u003cp>      quote layouts, speaker notes on most slides.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Images are https links to \u003ccode>upload.wikimedia.org\u003c/code> only (free licences, CORS-enabled),\u003c/li>\n\u003c/ul>\n\u003cp>      credited on each deck's last slide; no film stills.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Home page (with or without decks) and \u003ccode>/new\u003c/code> → Examples show them as real slide thumbnails\u003c/li>\n\u003c/ul>\n\u003cp>      with title, one line and a mono slide count.\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>\u003ccode>/examples/[slug]\u003c/code>: slideshow and read mode, \u003cstrong>Make a copy\u003c/strong> (new local deck, opens the\u003c/li>\n\u003c/ul>\n\u003cp>      editor) and \u003cstrong>Present\u003c/strong> (presenter at \u003ccode>/present/example:&lt;slug&gt;\u003c/code>, Exit returns to the example).\u003c/p>\n\u003cul class=\"md-checks\">\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Fix: \u003ccode>/new?tab=markdown&amp;example\u003c/code> opened directly preloads the Markdown example.\u003c/li>\n\u003cli class=\"done\">\u003cspan class=\"box\">✓\u003c/span>Tests: each example parses with no warnings, 8–12 slides, valid distinct theme, links only\u003c/li>\n\u003c/ul>\n\u003cp>      to upload.wikimedia.org, passes the strict validator; list, copy and present actions.\u003c/p>","acTotal":6,"acDone":6},{"id":"SL-0013","type":"task","title":"Fix the Docker build: keep docs/markdown-format.md in the image context","status":"done","priority":"high","tags":["deploy","bug"],"depends_on":[],"parent":null,"epic":null,"created":"2026-11-28","updated":"2026-11-28","project":"SL","bodyHtml":"\u003ch4 class=\"md-h\">Description\u003c/h4>\n\u003cp>Every Deploy run failed at \u003ccode>RUN pnpm build\u003c/code> inside the image: \u003ccode>.dockerignore\u003c/code> dropped all of\u003c/p>\n\u003cp>\u003ccode>docs/\u003c/code>, but \u003ccode>src/lib/format-doc.ts\u003c/code> imports \u003ccode>docs/markdown-format.md?raw\u003c/code> (the in-app /format\u003c/p>\n\u003cp>page and the Markdown example). CI builds outside Docker, so it stayed green.\u003c/p>\n\u003ch4 class=\"md-h\">Done\u003c/h4>\n\u003cul>\n\u003cli>\u003ccode>.dockerignore\u003c/code> drops \u003ccode>docs/*\u003c/code> except \u003ccode>docs/markdown-format.md\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>test/unit/dockerignore.test.ts\u003c/code> fails if any file src/ imports from outside src/ is ignored.\u003c/li>\n\u003cli>Checked with a local \u003ccode>docker build --target build\u003c/code>.\u003c/li>\n\u003c/ul>","acTotal":0,"acDone":0}]}</script>
<script>
const RAW = JSON.parse(document.getElementById('agile-data').textContent);
const ITEMS = RAW.items, SCOPE = RAW.scope;
const STATUSES = ["backlog","todo","in-progress","blocked","done"];
const PRIORITIES = ["high","low"];
const GROUP_KEYS = ['project','status','type','priority'];
// Single-project boards default to grouping by status (one project group is redundant);
// the global hub board defaults to grouping by project.
const state = { view: 'grouped', groupBy: SCOPE === 'global' ? 'project' : 'status', status: '', sortKey: 'id', sortDir: 1 };

function uniq(arr){ return [...new Set(arr)].sort(); }
function opt(sel, vals, label){ const e=document.getElementById(sel); e.innerHTML='<option value="">'+label+'</option>'+vals.map(v=>'<option>'+v+'</option>').join(''); }
opt('f-type', uniq(ITEMS.map(i=>i.type)), 'type: all');
opt('f-status', STATUSES.filter(s=>ITEMS.some(i=>i.status===s)), 'status: all');
opt('f-priority', uniq(ITEMS.map(i=>i.priority)), 'priority: all');
opt('f-tag', uniq(ITEMS.flatMap(i=>i.tags)), 'tag: all');
if (SCOPE === 'global'){ const e=document.getElementById('f-project'); e.hidden=false; opt('f-project', uniq(ITEMS.map(i=>i.project)), 'project: all'); }
const gbSel=document.getElementById('f-groupby');
gbSel.innerHTML=GROUP_KEYS.map(v=>'<option value="'+v+'"'+(v===state.groupBy?' selected':'')+'>group: '+v+'</option>').join('');

function filtered(){
  const q = document.getElementById('q').value.toLowerCase().trim();
  const fp = document.getElementById('f-project').value;
  const ft = document.getElementById('f-type').value;
  const fs = state.status || document.getElementById('f-status').value;
  const fpr = document.getElementById('f-priority').value;
  const ftag = document.getElementById('f-tag').value;
  return ITEMS.filter(i=>{
    if (fp && i.project!==fp) return false;
    if (ft && i.type!==ft) return false;
    if (fs && i.status!==fs) return false;
    if (fpr && i.priority!==fpr) return false;
    if (ftag && !i.tags.includes(ftag)) return false;
    if (q && !(i.id.toLowerCase().includes(q)||i.title.toLowerCase().includes(q)||i.tags.join(' ').toLowerCase().includes(q))) return false;
    return true;
  });
}
function badge(s){ return '<span class="badge '+s+'"><span class="dot"></span>'+s+'</span>'; }
function acStr(i){ return i.acTotal ? i.acDone+'/'+i.acTotal : ''; }
function detail(i){
  const deps = (i.depends_on&&i.depends_on.length)?'<b>depends on</b> '+i.depends_on.join(', '):'';
  const par = i.parent?'<b>parent</b> '+i.parent:'';
  const ep = i.epic?'<b>epic</b> '+i.epic:'';
  const tags = i.tags.length?'<b>tags</b> '+i.tags.join(', '):'';
  const kv = [par,ep,deps,tags,'<b>created</b> '+i.created,'<b>updated</b> '+i.updated].filter(Boolean).join('<span style="opacity:.4">·</span> ');
  return '<div class="detail">'+(i.bodyHtml||'<p style="color:var(--faint)">no description</p>')+'<div class="kv">'+kv+'</div></div>';
}
function renderMetrics(){
  const m = document.getElementById('metrics'); const all = ITEMS;
  const cards = STATUSES.map(s=>{ const n=all.filter(i=>i.status===s).length; return '<div class="metric'+(state.status===s?' on':'')+'" data-s="'+s+'" data-pick="'+s+'"><div class="v">'+n+'</div><div class="l">'+s+'</div></div>'; });
  cards.unshift('<div class="metric'+(state.status===''?' on':'')+'" data-pick=""><div class="v">'+all.length+'</div><div class="l">all</div></div>');
  m.innerHTML = cards.join('');
  m.querySelectorAll('[data-pick]').forEach(el=>el.onclick=()=>{ state.status = el.dataset.pick; document.getElementById('f-status').value=''; render(); });
}
function groupOrder(gb, keys){
  if(gb==='status') return keys.slice().sort((a,b)=>(STATUSES.indexOf(a)+1||99)-(STATUSES.indexOf(b)+1||99));
  if(gb==='priority') return keys.slice().sort((a,b)=>(PRIORITIES.indexOf(a)+1||99)-(PRIORITIES.indexOf(b)+1||99));
  return keys.slice().sort();
}
function renderGrouped(list){
  if(!list.length) return '<div class="empty">no items match</div>';
  const gb = state.groupBy;
  const groups = {};
  list.forEach(i=>{ const k=i[gb]||'—'; (groups[k]=groups[k]||[]).push(i); });
  return groupOrder(gb, Object.keys(groups)).map(p=>{
    const rows = groups[p].map(i=>(
      '<div class="row" data-id="'+i.id+'">'
      +'<span class="id">'+i.id+'</span>'
      +'<span class="ti"><span class="typ">'+i.type+'</span>'+i.title+'</span>'
      +'<span class="ac">'+acStr(i)+'</span>'
      +badge(i.status)
      +'<span class="pri '+i.priority+'">'+i.priority+'</span>'
      +'</div>'
    )).join('');
    return '<div class="group"><div class="gh"><span class="n">'+p+'</span><span class="c">'+groups[p].length+'</span></div>'+rows+'</div>';
  }).join('');
}
function renderTable(list){
  if(!list.length) return '<div class="empty">no items match</div>';
  const cols = [['id','id'],['title','title'],['project','project'],['type','type'],['status','status'],['priority','pri']];
  const sorted = [...list].sort((a,b)=>{ const k=state.sortKey; return String(a[k]).localeCompare(String(b[k]))*state.sortDir || a.id.localeCompare(b.id); });
  const head = '<tr>'+cols.map(c=>'<th data-sort="'+c[0]+'">'+c[0]+(state.sortKey===c[0]?(state.sortDir>0?' ▲':' ▼'):'')+'</th>').join('')+'</tr>';
  const body = sorted.map(i=>(
    '<tr data-id="'+i.id+'"><td class="id">'+i.id+'</td><td>'+i.title+'</td><td>'+i.project+'</td><td>'+i.type+'</td><td>'+badge(i.status)+'</td><td><span class="pri '+i.priority+'">'+i.priority+'</span></td></tr>'
  )).join('');
  return '<table class="tableview"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
}
let openId = null;
const drawer = document.getElementById('drawer');
// Resizable sidebar: drag the left-edge grip to set the drawer width.
(function(){
  const grip = document.getElementById('drawer-grip');
  let dragging = false;
  grip.addEventListener('mousedown', e => { dragging = true; grip.classList.add('drag'); document.body.style.userSelect = 'none'; e.preventDefault(); });
  window.addEventListener('mousemove', e => { if(!dragging) return; const w = Math.max(320, Math.min(window.innerWidth - e.clientX, window.innerWidth * 0.96)); drawer.style.width = w + 'px'; });
  window.addEventListener('mouseup', () => { if(!dragging) return; dragging = false; grip.classList.remove('drag'); document.body.style.userSelect = ''; });
})();
function markSel(){
  document.querySelectorAll('.row.sel,.tableview tbody tr.sel').forEach(el=>el.classList.remove('sel'));
  if(openId){ const el=document.querySelector('[data-id="'+openId+'"]'); if(el) el.classList.add('sel'); }
}
function closeDrawer(){ openId=null; drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); markSel(); }
function openItem(id){
  if(id===openId){ closeDrawer(); return; }
  const i=ITEMS.find(x=>x.id===id); if(!i) return;
  openId=id;
  document.getElementById('d-id').textContent=i.id;
  document.getElementById('d-badge').innerHTML=badge(i.status);
  document.getElementById('d-pri').innerHTML='<span class="pri '+i.priority+'">'+i.priority+'</span>';
  document.getElementById('d-title').innerHTML='<span class="typ">'+i.type+'</span>'+i.title;
  document.getElementById('drawer-body').innerHTML=detail(i);
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false');
  markSel();
}
document.getElementById('drawer-close').onclick=closeDrawer;
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
function render(){
  renderMetrics();
  gbSel.style.display = state.view==='grouped' ? '' : 'none';
  const list = filtered();
  document.getElementById('count').textContent = list.length+' / '+ITEMS.length+' items';
  const board = document.getElementById('board');
  board.innerHTML = state.view==='grouped' ? renderGrouped(list) : renderTable(list);
  board.querySelectorAll('[data-id]').forEach(el=>{
    el.onclick=(e)=>{ if(e.target.closest('[data-sort]')) return; openItem(el.dataset.id); };
  });
  if(state.view==='table'){
    board.querySelectorAll('[data-sort]').forEach(th=>th.onclick=()=>{ const k=th.dataset.sort; if(state.sortKey===k)state.sortDir*=-1; else {state.sortKey=k;state.sortDir=1;} render(); });
  }
  markSel();
}
document.querySelectorAll('.toggle button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.toggle button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); state.view=b.dataset.view; render(); });
['q','f-project','f-type','f-status','f-priority','f-tag'].forEach(id=>{ const el=document.getElementById(id); el.addEventListener('input',()=>{ if(id==='f-status')state.status=''; render(); }); });
gbSel.addEventListener('change',()=>{ state.groupBy=gbSel.value; render(); });
render();
</script>
</body>
</html>
